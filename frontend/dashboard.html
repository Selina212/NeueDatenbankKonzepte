<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
<header>
    <h1>Lagerverwaltung</h1>
    <nav>
      <a href="index.html">Start</a>
      <a href="produkte.html">Produkte</a>
      <a href="kategorien.html">Kategorien</a>
      <a href="lieferanten.html">Lieferanten</a>
      <a href="lagerbewegungen.html">4er-Kette</a>
      <a class="aktiv"href="dashboard.html">Dashboard</a>
      <a href="lagerorte.html">Lagerorte</a>
      <a href="bewegungen.html">Bewegungen</a>
    </nav>
  </header>
 <div class="dashboard-filters">
    <label>Von:</label>
    <input type="date" id="filter-from">

    <label>Bis:</label>
    <input type="date" id="filter-to">

    <label>Lagerort:</label>
    <select id="filter-lagerort">
        <option value="">Alle</option>
    </select>

    <label>Produkt:</label>
    <select id="filter-produkt">
        <option value="">Alle</option>
    </select>

    <button id="filter-apply">Filter anwenden</button>
</div>

<div class="dashboard-grid">

    <!-- KPI Lagerwert -->
    <div class="dashboard-card">
        <h2>Gesamtwert des Lagers</h2>
        <div id="lagerwert" style="font-size: 1.8rem; font-weight: bold;"></div>
    </div>

    <!-- Tabelle Produkte pro Kategorie -->
    <div class="dashboard-card">
        <h2>Produkte pro Kategorie</h2>
        <table id="kategorien-table">
            <thead>
            <tr>
                <th>Kategorie</th>
                <th>Anzahl Produkte</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Tabelle Bewegungen pro Lagerort -->
    <div class="dashboard-card">
        <h2>Bewegungen pro Lagerort</h2>
        <div class="dashboard-table-container">
            <table id="lagerort-table">
                <thead>
                <tr>
                    <th>Lagerort</th>
                    <th>Anzahl Bewegungen</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        </div>
    </div>

    <!-- Diagramme -->
    <div class="dashboard-card">
        <h2>Bewegungen pro Tag</h2>
        <canvas id="chartBewegungenProTag"></canvas>
    </div>

    <div class="dashboard-card">
        <h2>Produkte pro Kategorie</h2>
        <canvas id="chartProdukteProKategorie"></canvas>
    </div>

    <div class="dashboard-card">
        <h2>Bewegungen pro Lagerort</h2>
        <canvas id="chartBewegungenProLagerort"></canvas>
    </div>

</div>
<script src="js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/dashboard.js"></script>
<script>loadDashboard();</script>

</body>
</html>

</body>
</html>
