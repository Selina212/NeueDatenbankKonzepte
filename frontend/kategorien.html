<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kategorien</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lagerverwaltung</h1>
    <nav>
      <a href="index.html">Start</a>
      <a href="produkte.html">Produkte</a>
      <a class="aktiv" href="kategorien.html">Kategorien</a>
      <a href="lieferanten.html">Lieferanten</a>
      <a href="lagerbewegungen.html">4er-Kette</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="lagerorte.html">Lagerorte</a>
      <a href="bewegungen.html">Bewegungen</a>
    </nav>
  </header>

  <main>
    <div id="meldung" class="meldung"></div>

    <section class="bereich">
      <h2>Kategorien</h2>
      <div class="tabelle-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Beschreibung</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="kategorien-body"></tbody>
        </table>
      </div>
    </section>

    <form id="kategorie-form">
      <h2>Kategorie anlegen</h2>
      <div class="formular-grid">
        <div class="feld">
          <label for="name">Name</label>
          <input id="name" name="name" required>
        </div>
        <div class="feld ganz">
          <label for="beschreibung">Beschreibung</label>
          <textarea id="beschreibung" name="beschreibung"></textarea>
        </div>
      </div>
      <p>
        <button class="btn-anlegen" type="submit">Speichern</button>
      </p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/kategorien.js"></script>
</body>
</html>
