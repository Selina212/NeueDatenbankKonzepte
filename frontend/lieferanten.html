<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lieferanten</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lagerverwaltung</h1>
    <nav>
      <a href="index.html">Start</a>
      <a href="produkte.html">Produkte</a>
      <a href="kategorien.html">Kategorien</a>
      <a class="aktiv" href="lieferanten.html">Lieferanten</a>
      <a href="kette.html">4er-Kette</a>
       <a href="dashboard.html">Dashboard</a>
      <a href="lagerorte.html">Lagerorte</a>
      <a href="bewegungen.html">Bewegungen</a>
    </nav>
  </header>

  <main>
    <div id="meldung" class="meldung"></div>

    <section class="bereich">
      <h2>Lieferanten</h2>
      <div class="tabelle-wrapper">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Kontakt</th>
              <th>Email</th>
              <th>Telefon</th>
              <th>Stadt</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="lieferanten-body"></tbody>
        </table>
      </div>
    </section>

    <form id="lieferant-form">
      <h2>Lieferant anlegen</h2>
      <div class="formular-grid">
        <div class="feld">
          <label for="name">Name</label>
          <input id="name" name="name" required>
        </div>
        <div class="feld">
          <label for="kontakt-vorname">Kontakt Vorname</label>
          <input id="kontakt-vorname" name="kontakt.vorname">
        </div>
        <div class="feld">
          <label for="kontakt-nachname">Kontakt Nachname</label>
          <input id="kontakt-nachname" name="kontakt.nachname">
        </div>
        <div class="feld">
          <label for="kontakt-email">Kontakt Email</label>
          <input id="kontakt-email" name="kontakt.email" type="email">
        </div>
        <div class="feld">
          <label for="kontakt-telefon">Kontakt Telefon</label>
          <input id="kontakt-telefon" name="kontakt.telefon">
        </div>
        <div class="feld">
          <label for="adresse-stadt">Stadt</label>
          <input id="adresse-stadt" name="adresse.stadt">
        </div>
        <div class="feld">
          <label for="adresse-plz">PLZ</label>
          <input id="adresse-plz" name="adresse.plz">
        </div>
        <div class="feld">
          <label for="adresse-land">Land</label>
          <input id="adresse-land" name="adresse.land">
        </div>
      </div>
      <p>
        <button class="btn-anlegen" type="submit">Speichern</button>
      </p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/lieferanten.js"></script>
</body>
</html>
