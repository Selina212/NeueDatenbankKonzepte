<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagerorte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lagerverwaltung</h1>
    <nav>
      <a href="index.html">Start</a>
      <a href="produkte.html">Produkte</a>
      <a href="kategorien.html">Kategorien</a>
      <a href="lieferanten.html">Lieferanten</a>
      <a href="lagerbewegungen.html">4er-Kette</a>
      <a href="dashboard.html">Dashboard</a>
      <a class="aktiv" href="lagerorte.html">Lagerorte</a>
      <a href="bewegungen.html">Bewegungen</a>
    </nav>
  </header>

  <main>
    <div id="meldung" class="meldung"></div>

    <section class="bereich">
      <h2>Lagerorte</h2>
      <div class="tabelle-wrapper">
        <table>
          <thead>
            <tr>
              <th>Bezeichnung</th>
              <th>Halle</th>
              <th>Kapazität</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="lagerorte-body"></tbody>
        </table>
      </div>
    </section>

    <form id="lagerort-form">
      <h2>Lagerort anlegen</h2>
      <div class="formular-grid">
        <div class="feld">
          <label for="bezeichnung">Bezeichnung</label>
          <input id="bezeichnung" name="bezeichnung" required>
        </div>

        <div class="feld">
          <label for="halle">Halle</label>
          <input id="halle" name="halle" required>
        </div>

        <div class="feld">
          <label for="kapazität">Kapazität</label>
          <input id="kapazität" name="kapazität" type="number" required>
        </div>
      </div>

      <p>
        <button class="btn-anlegen" type="submit">Speichern</button>
      </p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/lagerorte.js"></script>
</body>
</html>
