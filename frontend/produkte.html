<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produkte</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lagerverwaltung</h1>
    <nav>
      <a href="index.html">Start</a>
      <a class="aktiv" href="produkte.html">Produkte</a>
      <a href="kategorien.html">Kategorien</a>
      <a href="lieferanten.html">Lieferanten</a>
      <a href="lagerbewegungen.html">4er-Kette</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="lagerorte.html">Lagerorte</a>
      <a href="bewegungen.html">Bewegungen</a>
    </nav>
  </header>

  <main>
    <div id="meldung" class="meldung"></div>

    <section class="bereich">
      <h2>Produkte</h2>
      <div class="suchleiste">
        <label for="suche">Produktsuche</label>
        <input id="suche" type="search" placeholder="Bezeichnung suchen">
      </div>
      <div class="tabelle-wrapper">
        <table>
          <thead>
            <tr>
              <th>Artikelnummer</th>
              <th>Bezeichnung</th>
              <th>Preis</th>
              <th>Bestand</th>
              <th>Mindestbestand</th>
              <th>Einheit</th>
              <th>Kategorie</th>
              <th>Lieferant</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="produkte-body"></tbody>
        </table>
      </div>
    </section>

    <form id="produkt-form">
      <h2>Produkt anlegen</h2>
      <div class="formular-grid">
        <div class="feld">
          <label for="artikelnummer">Artikelnummer</label>
          <input id="artikelnummer" name="artikelnummer" required>
        </div>
        <div class="feld">
          <label for="bezeichnung">Bezeichnung</label>
          <input id="bezeichnung" name="bezeichnung" required>
        </div>
        <div class="feld ganz">
          <label for="beschreibung">Beschreibung</label>
          <textarea id="beschreibung" name="beschreibung"></textarea>
        </div>
        <div class="feld">
          <label for="preis">Preis</label>
          <input id="preis" name="preis" type="number" min="0" step="0.01">
        </div>
        <div class="feld">
          <label for="bestand">Bestand</label>
          <input id="bestand" name="bestand" type="number" step="1">
        </div>
        <div class="feld">
          <label for="mindestbestand">Mindestbestand</label>
          <input id="mindestbestand" name="mindestbestand" type="number" min="0" step="1">
        </div>
        <div class="feld">
          <label for="einheit">Einheit</label>
          <input id="einheit" name="einheit">
        </div>
        <div class="feld">
          <label for="kategorie-id">Kategorie</label>
          <select id="kategorie-id" name="kategorie_id"></select>
        </div>
        <div class="feld">
          <label for="lieferant-id">Lieferant</label>
          <select id="lieferant-id" name="lieferant_id"></select>
        </div>
      </div>
      <p>
        <button class="btn-anlegen" type="submit">Speichern</button>
      </p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/produkte.js"></script>
</body>
</html>
