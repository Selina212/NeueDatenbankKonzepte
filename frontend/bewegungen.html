<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lagerbewegungen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lagerverwaltung</h1>
    <nav>
      <a href="index.html">Start</a>
      <a href="produkte.html">Produkte</a>
      <a href="kategorien.html">Kategorien</a>
      <a href="lieferanten.html">Lieferanten</a>
      <a href="lagerbewegungen.html">4er-Kette</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="lagerorte.html">Lagerorte</a>
      <a class="aktiv" href="bewegungen.html">Bewegungen</a>
    </nav>
  </header>

  <main>
    <div id="meldung" class="meldung"></div>

    <section class="bereich">
      <h2>Lagerbewegungen</h2>
      <div class="tabelle-wrapper">
        <table>
          <thead>
            <tr>
              <th>Datum</th>
              <th>Typ</th>
              <th>Menge</th>
              <th>Grund</th>
              <th>Produkt</th>
              <th>Lagerort</th>
              <th>Aktionen</th>
            </tr>
          </thead>
          <tbody id="bewegungen-body"></tbody>
        </table>
      </div>
    </section>

    <form id="bewegung-form">
      <h2>Bewegung anlegen</h2>
      <div class="formular-grid">
        <div class="feld">
          <label for="datum">Datum</label>
          <input id="datum" name="datum" type="date" required>
        </div>

        <div class="feld">
  <label for="typ">Typ</label>
  <select id="typ" name="typ" required>
    <option value="">Bitte wählen…</option>
    <option value="Eingang">Eingang</option>
    <option value="Ausgang">Ausgang</option>
  </select>
</div>


        <div class="feld">
          <label for="menge">Menge</label>
          <input id="menge" name="menge" type="number" min="1" required>
        </div>

        <div class="feld">
          <label for="grund">Grund</label>
          <input id="grund" name="grund">
        </div>

        <div class="feld">
  <label for="produkt_id">Produkt</label>
  <select id="produkt_id" name="produkt_id" required>
    <option value="">Bitte wählen…</option>
  </select>
</div>

<div class="feld">
  <label for="lagerort_id">Lagerort</label>
  <select id="lagerort_id" name="lagerort_id" required>
    <option value="">Bitte wählen…</option>
  </select>
</div>


      <p>
        <button class="btn-anlegen" type="submit">Speichern</button>
      </p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/bewegungen.js"></script>
</body>
</html>
